<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2800" width="1440" height="2800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
    <linearGradient id="eiaHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A"/>
      <stop offset="100%" stop-color="#142C54"/>
    </linearGradient>
    <filter id="eiaCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1D3A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 01. HEADER -->
  <!-- ========================================== -->
  <g id="EIA-01-Header">
    <rect width="1440" height="80" fill="#0B1D3A"/>
    <line x1="0" y1="80" x2="1440" y2="80" stroke="#1E3A8A" stroke-opacity="0.3"/>
    
    <g id="EIA-Brand-Logo">
      <rect x="120" y="24" width="32" height="32" rx="8" fill="#1E3A8A"/>
      <polygon points="136,30 145,46 127,46" fill="#D4AF37"/>
      <text x="164" y="45" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">SYNTRA</text>
      <text x="250" y="45" font-size="14" font-weight="500" fill="#94A3B8">CONSULTING</text>
    </g>

    <g id="EIA-Nav-Menu">
      <text x="820" y="46" font-size="15" font-weight="500" fill="#CBD5E1">Inicio</text>
      <text x="900" y="46" font-size="15" font-weight="500" fill="#CBD5E1">Equipo</text>
      <text x="980" y="46" font-size="15" font-weight="500" fill="#CBD5E1">Contacto</text>
      
      <rect x="1070" y="22" width="90" height="36" rx="18" fill="#1E3A8A" stroke="#3B82F6"/>
      <text x="1092" y="45" font-size="14" font-weight="700" fill="#FFFFFF">EIA</text>
      <path d="M1126 41 L1131 46 L1136 41" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 02. HERO EIA SECTION -->
  <!-- ========================================== -->
  <g id="EIA-02-Hero">
    <rect y="80" width="1440" height="480" fill="url(#eiaHeroBg)"/>
    
    <g id="EIA-Hero-Badge">
      <rect x="120" y="140" width="230" height="32" rx="16" fill="#1E3A8A" fill-opacity="0.6" stroke="#3B82F6" stroke-opacity="0.4"/>
      <circle cx="136" cy="156" r="4" fill="#D4AF37"/>
      <text x="150" y="161" font-size="12" font-weight="700" fill="#93C5FD">CASO DE ESTUDIO · EIA</text>
    </g>

    <text x="120" y="225" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      Índice General de Transformación
    </text>
    <text x="120" y="275" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      Arquitectura, Sistemas &amp; Procesos
    </text>

    <text x="120" y="330" font-size="17" font-weight="400" fill="#CBD5E1">
      Recorrido integral del proyecto de transformación para Emprendimientos Inmobiliarios Arenales S.A.
    </text>
    <text x="120" y="358" font-size="17" font-weight="400" fill="#CBD5E1">
      (Grupo Madero Este): diagnóstico CMM 1–2, pliego RFP, integración de SaaS y hoja de ruta a 12 meses.
    </text>

    <!-- EIA Popover Preview -->
    <g id="EIA-Popover-Metodologia">
      <rect x="120" y="400" width="340" height="42" rx="8" fill="#132B52" stroke="#2563EB"/>
      <circle cx="142" cy="421" r="9" fill="#D4AF37"/>
      <text x="162" y="426" font-size="13" font-weight="700" fill="#FFFFFF">¿Qué es? Ver explicación metodológica</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 03. PERFIL ORGANIZACIONAL (ARENALES S.A.) -->
  <!-- ========================================== -->
  <g id="EIA-03-Perfil-Empresa">
    <rect y="560" width="1440" height="380" fill="#FDFBF7"/>
    
    <g id="Perfil-Card" filter="url(#eiaCardShadow)">
      <rect x="120" y="600" width="1200" height="280" rx="20" fill="#FFFFFF" stroke="#E2E8F0"/>
      
      <!-- Columna Texto -->
      <text x="160" y="645" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1">PERFIL ORGANIZACIONAL</text>
      <text x="160" y="685" font-size="26" font-weight="800" fill="#0B1D3A">Emprendimientos Inmobiliarios Arenales S.A.</text>
      <text x="160" y="720" font-size="15" font-weight="400" fill="#475569">
        Compañía familiar del Grupo Madero Este. Opera desde 1998 administrando y alquilando oficinas corporativas premium
      </text>
      <text x="160" y="745" font-size="15" font-weight="400" fill="#475569">
        en Diques 2 y 3 de Puerto Madero (locatarios: MasterCard, petroleras, embajadas). Dirección ejecutiva: Dora Poceiro.
      </text>

      <!-- Badge Empresa Cliente -->
      <g id="Badge-Grupo-Madero">
        <rect x="1040" y="630" width="240" height="70" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
        <circle cx="1070" cy="665" r="14" fill="#1E3A8A"/>
        <text x="1095" y="660" font-size="11" font-weight="700" fill="#64748B">CASO DE ESTUDIO</text>
        <text x="1095" y="680" font-size="14" font-weight="700" fill="#0B1D3A">Grupo Madero Este</text>
      </g>

      <!-- 4 Quick Facts -->
      <line x1="160" y1="780" x2="1240" y2="780" stroke="#F1F5F9"/>
      
      <g id="Fact-1">
        <text x="160" y="815" font-size="12" font-weight="500" fill="#64748B">Estructura</text>
        <text x="160" y="842" font-size="18" font-weight="800" fill="#0B1D3A">7 personas</text>
      </g>

      <g id="Fact-2">
        <text x="440" y="815" font-size="12" font-weight="500" fill="#64748B">Cartera Activa</text>
        <text x="440" y="842" font-size="18" font-weight="800" fill="#0B1D3A">~40 contratos AAA</text>
      </g>

      <g id="Fact-3">
        <text x="740" y="815" font-size="12" font-weight="500" fill="#64748B">ERP Contable Vigente</text>
        <text x="740" y="842" font-size="18" font-weight="800" fill="#0B1D3A">Tango Gestión (2026)</text>
      </g>

      <g id="Fact-4">
        <text x="1040" y="815" font-size="12" font-weight="500" fill="#64748B">SaaS Seleccionado</text>
        <text x="1040" y="842" font-size="18" font-weight="800" fill="#1E3A8A">Webdox CLM (72,2%)</text>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 04. RECORRIDO METODOLÓGICO (5 SECCIONES) -->
  <!-- ========================================== -->
  <g id="EIA-04-Secciones-Metodologicas">
    <rect y="940" width="1440" height="1380" fill="#FFFFFF"/>
    
    <text x="120" y="1000" font-size="32" font-weight="800" fill="#0B1D3A" letter-spacing="-0.5">
      Secciones del Recorrido Metodológico
    </text>
    <text x="120" y="1030" font-size="16" font-weight="400" fill="#64748B">
      Haga click en cada sección para editar el resumen ejecutivo de la entrega correspondiente:
    </text>

    <!-- Seccion 1 Card -->
    <g id="Section-Card-01" filter="url(#eiaCardShadow)">
      <rect x="120" y="1070" width="1200" height="210" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="120" y="1070" width="6" height="210" rx="3" fill="#1E3A8A"/>
      <text x="160" y="1120" font-size="20" font-weight="800" fill="#0B1D3A">1. Entender la Organización (Diagnóstico CMM &amp; MoSCoW)</text>
      <text x="160" y="1155" font-size="14" font-weight="400" fill="#475569">
        Relevamiento de actores (Comercial, Legales, Facturación y Tesorería), mapa de circuitos en USD/UVA, nivel de madurez CMM 1–2
      </text>
      <text x="160" y="1180" font-size="14" font-weight="400" fill="#475569">
        y preservación obligatoria del núcleo contable Tango Gestión (Won't Have) para proteger la inversión reciente.
      </text>
      <rect x="160" y="1215" width="220" height="34" rx="8" fill="#F1F5F9"/>
      <text x="180" y="1237" font-size="13" font-weight="700" fill="#1E3A8A">Ver Página Fase 01 →</text>
    </g>

    <!-- Seccion 2 Card -->
    <g id="Section-Card-02" filter="url(#eiaCardShadow)">
      <rect x="120" y="1310" width="1200" height="210" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="120" y="1310" width="6" height="210" rx="3" fill="#1E3A8A"/>
      <text x="160" y="1360" font-size="20" font-weight="800" fill="#0B1D3A">2. Definir el Cambio (Arquitectura Destino en 4 Capas)</text>
      <text x="160" y="1395" font-size="14" font-weight="400" fill="#475569">
        Diseño del plano maestro a 2–3 años en 4 capas: Negocio, Datos, Aplicaciones e Infraestructura. Justificación del Escenario 4:
      </text>
      <text x="160" y="1420" font-size="14" font-weight="400" fill="#475569">
        SaaS Especializado modular en la nube conectado por conectores bidireccionales a las bases de Tango.
      </text>
      <rect x="160" y="1455" width="220" height="34" rx="8" fill="#F1F5F9"/>
      <text x="180" y="1477" font-size="13" font-weight="700" fill="#1E3A8A">Ver Página Fase 02 →</text>
    </g>

    <!-- Seccion 4 Card -->
    <g id="Section-Card-04" filter="url(#eiaCardShadow)">
      <rect x="120" y="1550" width="1200" height="210" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="120" y="1550" width="6" height="210" rx="3" fill="#1E3A8A"/>
      <text x="160" y="1600" font-size="20" font-weight="800" fill="#0B1D3A">4. Evaluar Opciones (Matriz RFP 77 Ítems &amp; TCO 3 Años)</text>
      <text x="160" y="1635" font-size="14" font-weight="400" fill="#475569">
        8 filtros Go/No-Go y pliego multicriterio. Webdox CLM ganó con 72,2% (89% en ciclo de contratos) superando a Microsoft 365,
      </text>
      <text x="160" y="1660" font-size="14" font-weight="400" fill="#475569">
        Calipso y Tango. El TCO a 3 años ($71.036 vs $66.073 USD) demostró menor riesgo y entrega en 6–8 semanas sin código a medida.
      </text>
      <rect x="160" y="1695" width="220" height="34" rx="8" fill="#F1F5F9"/>
      <text x="180" y="1717" font-size="13" font-weight="700" fill="#1E3A8A">Ver Página Fase 04 →</text>
    </g>

    <!-- Seccion 5 Card -->
    <g id="Section-Card-05" filter="url(#eiaCardShadow)">
      <rect x="120" y="1790" width="1200" height="210" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="120" y="1790" width="6" height="210" rx="3" fill="#1E3A8A"/>
      <text x="160" y="1840" font-size="20" font-weight="800" fill="#0B1D3A">5. Explorar Innovación (Extracción con IA &amp; Human-in-the-Loop)</text>
      <text x="160" y="1875" font-size="14" font-weight="400" fill="#475569">
        Pipeline de lectura inteligente de contratos: ingesta de PDF escaneados, OCR, extracción con LLM, revisión por operador humano
      </text>
      <text x="160" y="1900" font-size="14" font-weight="400" fill="#475569">
        en 2 clics e impacto seguro en el ERP. Protocolo de pruebas cuantitativas de precisión antes de la puesta en marcha.
      </text>
      <rect x="160" y="1935" width="220" height="34" rx="8" fill="#F1F5F9"/>
      <text x="180" y="1957" font-size="13" font-weight="700" fill="#1E3A8A">Ver Página Fase 05 →</text>
    </g>

    <!-- Seccion 6 Card -->
    <g id="Section-Card-06" filter="url(#eiaCardShadow)">
      <rect x="120" y="2030" width="1200" height="210" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="120" y="2030" width="6" height="210" rx="3" fill="#1E3A8A"/>
      <text x="160" y="2080" font-size="20" font-weight="800" fill="#0B1D3A">6. Cierre &amp; Hoja de Ruta (Roadmap 12 Meses &amp; Decisiones)</text>
      <text x="160" y="2115" font-size="14" font-weight="400" fill="#475569">
        Plan de acción estructurado en 5 fases secuenciales (Formalización, PoC de integración, RFP y negociación, migración de contratos y capacitación).
      </text>
      <text x="160" y="2140" font-size="14" font-weight="400" fill="#475569">
        Las 4 decisiones inmediatas para Dora Poceiro y el Directorio de Grupo Madero Este.
      </text>
      <rect x="160" y="2175" width="220" height="34" rx="8" fill="#F1F5F9"/>
      <text x="180" y="2197" font-size="13" font-weight="700" fill="#1E3A8A">Ver Página Fase 06 →</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 05. BANNER CIERRE & FOOTER -->
  <!-- ========================================== -->
  <g id="EIA-05-Footer">
    <rect y="2320" width="1440" height="480" fill="#0B1D3A"/>
    
    <!-- CTA Box -->
    <rect x="220" y="2370" width="1000" height="200" rx="20" fill="#142C54" stroke="#1E3A8A"/>
    <text x="280" y="2430" font-size="28" font-weight="800" fill="#FFFFFF">¿Querés transformar la gestión de tu empresa?</text>
    <text x="280" y="2465" font-size="15" font-weight="400" fill="#CBD5E1">
      En Syntra articulamos arquitectura empresarial, rigor metodológico y selección tecnológica independiente.
    </text>
    <rect x="280" y="2490" width="200" height="44" rx="8" fill="#1E3A8A"/>
    <text x="315" y="2517" font-size="14" font-weight="700" fill="#FFFFFF">Conversar con Syntra →</text>

    <!-- Footer Copyright -->
    <text x="120" y="2720" font-size="13" font-weight="400" fill="#64748B">
      Copyright 2026 · Todos los derechos reservados · Syntra Consulting
    </text>
    <text x="1100" y="2720" font-size="13" font-weight="400" fill="#94A3B8">
      contacto@syntra.com · Puerto Madero, CABA
    </text>
  </g>
</svg>
