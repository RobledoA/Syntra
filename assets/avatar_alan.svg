<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="alan-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="alan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="alan-blazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="alan-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
    <filter id="alan-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="320" rx="20" fill="url(#alan-bg)"/>
  <circle cx="160" cy="140" r="115" fill="url(#alan-glow)"/>
  <circle cx="160" cy="140" r="114" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Subtle Tech Geometric Grid Elements -->
  <circle cx="60" cy="70" r="3" fill="#38BDF8" opacity="0.6"/>
  <circle cx="260" cy="80" r="2.5" fill="#A95335" opacity="0.7"/>
  <path d="M50 90 L70 90 L80 100" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.3"/>
  <path d="M270 100 L250 100 L240 110" fill="none" stroke="#818CF8" stroke-width="1" opacity="0.3"/>

  <!-- Character Group -->
  <g id="character" filter="url(#alan-shadow)">
    <!-- Shoulders & Torso -->
    <path d="M72 320 C75 255 110 230 142 224 L142 270 L178 270 L178 224 C210 230 245 255 248 320 Z" fill="#A95335"/>
    <!-- Executive Tech Blazer -->
    <path d="M68 320 C72 260 100 238 126 230 L152 320 L68 320 Z" fill="url(#alan-blazer)"/>
    <path d="M252 320 C248 260 220 238 194 230 L168 320 L252 320 Z" fill="url(#alan-blazer)"/>
    <!-- Blazer Lapels -->
    <path d="M126 230 L160 285 L144 320 L115 320 L108 250 Z" fill="#334155"/>
    <path d="M194 230 L160 285 L176 320 L205 320 L212 250 Z" fill="#334155"/>

    <!-- Neck -->
    <path d="M142 185 L142 230 C142 238 178 238 178 230 L178 185 Z" fill="#F4BA94"/>
    <path d="M142 215 C152 225 168 225 178 215 L178 230 C168 236 152 236 142 230 Z" fill="#E2A27A"/>

    <!-- Head & Ears -->
    <ellipse cx="120" cy="165" rx="8" ry="14" fill="#F4BA94"/>
    <ellipse cx="120" cy="165" rx="4" ry="8" fill="#E2A27A"/>
    <ellipse cx="200" cy="165" rx="8" ry="14" fill="#F4BA94"/>
    <ellipse cx="200" cy="165" rx="4" ry="8" fill="#E2A27A"/>
    
    <!-- Face Contour -->
    <path d="M124 140 C124 105 196 105 196 140 C196 182 186 210 160 210 C134 210 124 182 124 140 Z" fill="#FBD5B9"/>

    <!-- Hair (Sharp Modern Textured Quiff) -->
    <path d="M120 135 C116 110 125 75 160 72 C192 70 206 95 204 125 C198 102 182 86 160 86 C138 86 126 108 120 135 Z" fill="url(#alan-hair)"/>
    <path d="M122 130 C122 110 132 90 152 82 C175 74 198 84 204 110 C202 100 190 90 170 90 C145 90 130 105 125 130 Z" fill="#4B5563"/>
    <path d="M118 135 C117 148 122 158 124 162 L124 140 Z" fill="#1A202C"/>
    <path d="M202 135 C203 148 198 158 196 162 L196 140 Z" fill="#1A202C"/>

    <!-- Eyebrows -->
    <path d="M134 142 Q144 138 152 142" fill="none" stroke="#1A202C" stroke-width="3" stroke-linecap="round"/>
    <path d="M168 142 Q176 138 186 142" fill="none" stroke="#1A202C" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes -->
    <ellipse cx="144" cy="153" rx="4.5" ry="5" fill="#1E293B"/>
    <ellipse cx="176" cy="153" rx="4.5" ry="5" fill="#1E293B"/>
    <circle cx="145.5" cy="151.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="177.5" cy="151.5" r="1.5" fill="#FFFFFF"/>

    <!-- Modern Tech Glasses (Slim Rectangular Dark Acetate with blue-light reflex) -->
    <rect x="133" y="145" width="22" height="16" rx="4" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="165" y="145" width="22" height="16" rx="4" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <line x1="155" y1="152" x2="165" y2="152" stroke="#0F172A" stroke-width="2.5"/>
    <line x1="124" y1="150" x2="133" y2="150" stroke="#0F172A" stroke-width="2"/>
    <line x1="187" y1="150" x2="196" y2="150" stroke="#0F172A" stroke-width="2"/>
    <!-- Blue light lens gleam -->
    <path d="M136 148 L148 148" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M168 148 L180 148" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Nose -->
    <path d="M160 152 L158 168 L164 168" fill="none" stroke="#E2A27A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Beard / Subtle Tech Stubble -->
    <path d="M138 186 Q160 204 182 186 Q178 198 160 200 Q142 198 138 186 Z" fill="#1A202C" opacity="0.15"/>

    <!-- Smile / Executive Expression -->
    <path d="M150 182 Q160 190 170 182" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom Floating Badge (Cloud & Infrastructure) -->
  <g transform="translate(225, 235)">
    <circle cx="20" cy="20" r="20" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <!-- Cloud Icon -->
    <path d="M14 24 C12 24 10.5 22.5 10.5 20.5 C10.5 18.7 12 17.2 13.8 17.1 C14.4 14.8 16.5 13 19 13 C22 13 24.5 15.2 24.8 18.2 C26.7 18.5 28 20.1 28 22 C28 24.2 26.2 24.5 24.5 24.5 Z" fill="#38BDF8"/>
  </g>
</svg>
