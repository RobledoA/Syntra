<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="german-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="german-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="german-sweater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="german-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="german-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="320" rx="20" fill="url(#german-bg)"/>
  <circle cx="160" cy="140" r="115" fill="url(#german-glow)"/>
  <circle cx="160" cy="140" r="114" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.45"/>

  <!-- Subtle YAML & Container Node Glyphs -->
  <text x="48" y="85" font-family="monospace" font-size="12" fill="#818CF8" opacity="0.4">k8s:</text>
  <text x="48" y="102" font-family="monospace" font-size="12" fill="#A5B4FC" opacity="0.4">  replicas: 99</text>
  <circle cx="255" cy="85" r="2.5" fill="#818CF8" opacity="0.6"/>
  <circle cx="270" cy="95" r="2" fill="#C7D2FE" opacity="0.5"/>

  <!-- Character Group -->
  <g id="character" filter="url(#german-shadow)">
    <!-- Shoulders & Dark Indigo Crewneck Sweater -->
    <path d="M70 320 C74 250 110 230 142 225 L142 268 L178 268 L178 225 C210 230 246 250 250 320 Z" fill="url(#german-sweater)"/>
    
    <!-- Ribbed Sweater Collar -->
    <path d="M136 226 C144 234 176 234 184 226 L180 240 C172 246 148 246 140 240 Z" fill="#4338CA"/>

    <!-- Neck -->
    <path d="M142 182 L142 225 C142 232 178 232 178 225 L178 182 Z" fill="#F4BA94"/>
    <path d="M142 210 C152 220 168 220 178 210 L178 222 C168 228 152 228 142 222 Z" fill="#D89A74"/>

    <!-- Head & Ears -->
    <ellipse cx="118" cy="165" rx="8" ry="14" fill="#F4BA94"/>
    <ellipse cx="118" cy="165" rx="4" ry="8" fill="#D89A74"/>
    <ellipse cx="202" cy="165" rx="8" ry="14" fill="#F4BA94"/>
    <ellipse cx="202" cy="165" rx="4" ry="8" fill="#D89A74"/>

    <!-- Face Contour -->
    <path d="M122 138 C122 102 198 102 198 138 C198 184 186 208 160 208 C134 208 122 184 122 138 Z" fill="#FBD6BC"/>

    <!-- Swept-back dark hair with gentle side wave -->
    <path d="M118 136 C116 102 128 72 160 70 C194 72 204 100 202 136 C194 100 178 84 160 84 C138 84 124 102 118 136 Z" fill="url(#german-hair)"/>
    <path d="M128 92 C146 76 172 78 192 90 C180 84 164 80 150 82 C138 84 132 88 128 92 Z" fill="#4B5563"/>
    <!-- Sideburns -->
    <path d="M120 138 L122 164 L126 164 L124 138 Z" fill="#1F2937"/>
    <path d="M200 138 L198 164 L194 164 L196 138 Z" fill="#1F2937"/>

    <!-- Eyebrows -->
    <path d="M134 140 Q144 136 153 140" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <path d="M167 140 Q176 136 186 140" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes Behind Glasses -->
    <ellipse cx="144" cy="151" rx="4.5" ry="5" fill="#1E293B"/>
    <ellipse cx="176" cy="151" rx="4.5" ry="5" fill="#1E293B"/>
    <circle cx="145.5" cy="149.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="177.5" cy="149.5" r="1.5" fill="#FFFFFF"/>

    <!-- Round Tech Glasses (Architect wireframe style) -->
    <circle cx="144" cy="151" r="14" fill="none" stroke="#818CF8" stroke-width="2.2"/>
    <circle cx="176" cy="151" r="14" fill="none" stroke="#818CF8" stroke-width="2.2"/>
    <line x1="158" y1="151" x2="162" y2="151" stroke="#818CF8" stroke-width="2.5"/>
    <line x1="122" y1="150" x2="130" y2="151" stroke="#818CF8" stroke-width="2"/>
    <line x1="190" y1="151" x2="198" y2="150" stroke="#818CF8" stroke-width="2"/>
    <!-- Glasses reflection gleam -->
    <path d="M136 143 Q144 141 150 145" fill="none" stroke="#C7D2FE" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

    <!-- Nose -->
    <path d="M160 148 L157 166 L163 166" fill="none" stroke="#D89A74" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Distinguished Goatee & Mustache (The Kubernetes Whisperer Look) -->
    <path d="M149 174 Q160 177 171 174" fill="none" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>
    <path d="M152 188 C152 205 168 205 168 188 Z" fill="#1F2937"/>
    <path d="M136 186 Q160 206 184 186 Q178 196 160 198 Q142 196 136 186 Z" fill="#1F2937" opacity="0.2"/>

    <!-- Calm Intellectual Smile -->
    <path d="M152 182 Q160 188 168 182" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Bottom Floating Badge (Kubernetes Wheel / Container Whisperer) -->
  <g transform="translate(225, 235)">
    <circle cx="20" cy="20" r="20" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
    <!-- K8s Helm Icon -->
    <circle cx="20" cy="20" r="8" fill="none" stroke="#818CF8" stroke-width="2"/>
    <circle cx="20" cy="20" r="3" fill="#818CF8"/>
    <line x1="20" y1="7" x2="20" y2="12" stroke="#818CF8" stroke-width="2"/>
    <line x1="20" y1="28" x2="20" y2="33" stroke="#818CF8" stroke-width="2"/>
    <line x1="7" y1="20" x2="12" y2="20" stroke="#818CF8" stroke-width="2"/>
    <line x1="28" y1="20" x2="33" stroke="#818CF8" stroke-width="2"/>
  </g>
</svg>
